name: Release

# 打一个 v 开头的 tag 就构建并发布，也可以在 Actions 页面手动触发试跑。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: 记录工具链版本
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: 跑核心逻辑断言
        run: ./Scripts/run-checks.sh

      - name: 校验各语言文案是否齐全
        run: python3 Scripts/check-localization.py

      - name: 构建通用二进制并打包
        run: |
          # tag 是 v1.2.3，Info.plist 里要的是 1.2.3。手动触发时没有 tag，用 0.0.0。
          VERSION="0.0.0"
          case "$GITHUB_REF" in
              refs/tags/v*) VERSION="${GITHUB_REF_NAME#v}" ;;
          esac
          export VERSION
          echo "版本号: $VERSION"
          ./Scripts/build-app.sh --zip

      - name: 确认产物是双架构且签名有效
        run: |
          APP="dist/Fxxking Work.app"
          lipo -archs "$APP/Contents/MacOS/Fxxking_Work"
          codesign --verify --deep --strict --verbose=1 "$APP"

      - name: 重命名成适合下载的文件名
        id: package
        run: |
          NAME="Fxxking_Work-${GITHUB_REF_NAME}-macos-universal.zip"
          mv "dist/Fxxking Work.zip" "dist/$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          shasum -a 256 "dist/$NAME" | tee dist/checksum.txt

      - name: 上传构建产物（手动触发时用来试跑，不发版）
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: app-zip
          path: dist/*.zip

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat .github/release-notes.md
            echo
            echo '```'
            cat dist/checksum.txt
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            "dist/${{ steps.package.outputs.name }}"
