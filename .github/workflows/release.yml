name: Release

# 打一个 v 开头的 tag 就构建并发布，也可以在 Actions 页面手动触发试跑。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: 记录工具链版本
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: 跑核心逻辑断言
        run: ./Scripts/run-checks.sh

      - name: 校验各语言文案是否齐全
        run: python3 Scripts/check-localization.py

      - name: 获取并校验固定版本的更新框架
        run: |
          SDK_DIR="$(./Scripts/fetch-sparkle.sh)"
          echo "SPARKLE_SDK_DIR=$SDK_DIR" >> "$GITHUB_ENV"

      - name: 构建通用二进制并打包
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          # tag 是 v1.2.4，Info.plist 里要的是 1.2.4。手动触发时没有 tag，用 0.0.0。
          VERSION="0.0.0"
          case "$GITHUB_REF" in
              refs/tags/v*) VERSION="${GITHUB_REF_NAME#v}" ;;
          esac
          export VERSION
          echo "版本号: $VERSION"
          ./Scripts/build-app.sh --zip

      - name: 确认产物是双架构且签名有效
        run: |
          APP="dist/Fxxking Work.app"
          ARCHS="$(lipo -archs "$APP/Contents/MacOS/Fxxking_Work")"
          echo "架构: $ARCHS"
          case " $ARCHS " in *" arm64 "*) ;; *) echo "缺少 arm64 架构" >&2; exit 1 ;; esac
          case " $ARCHS " in *" x86_64 "*) ;; *) echo "缺少 x86_64 架构" >&2; exit 1 ;; esac
          codesign --verify --deep --strict --verbose=1 "$APP"

      - name: 准备签名更新和下载校验
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          PREVIOUS_TAG="$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft == false and .prerelease == false)][0].tag_name // ""')"
          if [ -n "$PREVIOUS_TAG" ]; then
            HAS_FEED="$(gh release view "$PREVIOUS_TAG" --json assets --jq '[.assets[].name] | contains(["appcast.xml"])')"
            if [ "$HAS_FEED" = true ]; then
              mkdir -p .build/previous-release
              gh release download "$PREVIOUS_TAG" --pattern appcast.xml --dir .build/previous-release
              export PREVIOUS_APPCAST="$PWD/.build/previous-release/appcast.xml"
            fi
          fi
          ./Scripts/prepare-release.sh

      - name: 准备手动构建的下载文件
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          mkdir -p dist/release
          cp "dist/Fxxking Work.zip" dist/release/Fxxking_Work-macos-universal.zip
          (cd dist/release && shasum -a 256 Fxxking_Work-macos-universal.zip > SHA256SUMS)

      - name: 上传构建产物（手动触发时用来试跑，不发版）
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: app-zip
          path: |
            dist/release/Fxxking_Work-macos-universal.zip
            dist/release/SHA256SUMS

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat .github/release-notes.md
            echo
            echo '```'
            cat dist/release/SHA256SUMS
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" --draft --verify-tag \
            --notes-file notes.md \
            "dist/release/Fxxking_Work-macos-universal.zip" \
            "dist/release/SHA256SUMS" \
            "dist/release/appcast.xml"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
